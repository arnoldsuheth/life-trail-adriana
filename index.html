<style>
:root{--ouro:#dfbf88;--violeta:#b69be8;--bg:#100e17}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:#f4eef8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow:hidden;min-height:100dvh}
.aurora{position:fixed;inset:-20%;z-index:0;filter:blur(70px);opacity:.75}
.aurora i{position:absolute;border-radius:50%;animation:flutua 16s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:55vmax;height:55vmax;left:-10%;top:-15%;background:radial-gradient(circle,var(--violeta),transparent 65%)}
.aurora i:nth-child(2){width:50vmax;height:50vmax;right:-15%;bottom:-20%;background:radial-gradient(circle,var(--ouro),transparent 65%);animation-delay:-6s;opacity:.65}
.aurora i:nth-child(3){width:35vmax;height:35vmax;left:35%;top:40%;background:radial-gradient(circle,#6c5ce7,transparent 65%);animation-delay:-11s;opacity:.5}
@keyframes flutua{to{transform:translate(8vmax,-6vmax) scale(1.2)}}
.card{position:relative;z-index:1;width:min(100%,380px);padding:34px 26px 26px;border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.22);box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.35);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);text-align:center;animation:entra .8s cubic-bezier(.2,.9,.2,1) both}
@keyframes entra{from{opacity:0;transform:translateY(24px) scale(.96)}}
.card.erro{animation:treme .45s}
@keyframes treme{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.selo{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:700;color:#1a1424;background:conic-gradient(from 210deg,var(--ouro),#fff3d6,var(--violeta),var(--ouro));box-shadow:0 0 0 6px rgba(255,255,255,.08),0 10px 30px color-mix(in srgb,var(--ouro) 45%,transparent);position:relative}
.selo::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(255,255,255,.3);animation:pulsa 2.6s ease-out infinite}
@keyframes pulsa{to{transform:scale(1.35);opacity:0}}
h1{font-size:13px;letter-spacing:.34em;font-weight:600;color:var(--ouro);text-transform:uppercase}
h2{font-size:25px;font-weight:700;margin:6px 0 4px;letter-spacing:-.01em}
p.sub{font-size:14px;opacity:.7;margin-bottom:22px}
.campo{position:relative;margin-bottom:12px}
input[type=password],input[type=text]{width:100%;height:54px;padding:0 52px 0 18px;border-radius:16px;border:1px solid rgba(255,255,255,.22);background:rgba(10,8,18,.45);color:#fff;font-size:17px;outline:none;transition:.2s;-webkit-appearance:none}
input:focus{border-color:var(--ouro);box-shadow:0 0 0 4px color-mix(in srgb,var(--ouro) 22%,transparent)}
input::placeholder{color:rgba(255,255,255,.4)}
.olho{position:absolute;right:6px;top:6px;width:42px;height:42px;border-radius:12px;border:0;background:transparent;color:#fff;opacity:.7;font-size:19px;cursor:pointer}
.lembrar{display:flex;align-items:center;gap:10px;font-size:14px;opacity:.85;margin:4px 2px 16px;text-align:left;cursor:pointer}
.lembrar input{width:20px;height:20px;accent-color:var(--ouro)}
button.entrar{width:100%;height:54px;border:0;border-radius:16px;font-size:16px;font-weight:700;color:#1b1424;cursor:pointer;background:linear-gradient(135deg,#fff3d6,var(--ouro) 55%,color-mix(in srgb,var(--ouro) 70%,#000));box-shadow:0 10px 26px color-mix(in srgb,var(--ouro) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.7);transition:transform .15s,box-shadow .2s;position:relative;overflow:hidden}
button.entrar::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:brilho 3.4s ease-in-out infinite}
@keyframes brilho{60%,100%{left:130%}}
button.entrar:active{transform:scale(.97)}
button.entrar:disabled{opacity:.7}
.msg{min-height:20px;font-size:13.5px;margin-top:12px;color:#ffb4c1}
button.link{display:block;margin:14px auto 0;background:none;border:0;color:var(--ouro);font-size:14px;cursor:pointer;opacity:.9;text-decoration:underline;text-underline-offset:3px;padding:6px}
.rodape{margin-top:14px;font-size:11.5px;opacity:.45;letter-spacing:.04em}
.selo img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;border-radius:50%}
.selo.foto{background:#1a1424;overflow:hidden;padding:0}.selo.foto img{transform:scale(1.95);transform-origin:50% 13%}
.card.comfundo{padding-top:190px;overflow:hidden}
.card.comfundo::before{content:"";position:absolute;inset:0;background:var(--fundo) 50% 8%/cover no-repeat;opacity:.5;-webkit-mask-image:linear-gradient(#000 25%,rgba(0,0,0,.55) 48%,transparent 72%);mask-image:linear-gradient(#000 25%,rgba(0,0,0,.55) 48%,transparent 72%);z-index:-1;border-radius:inherit}
.card.comfundo>*{position:relative}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

const te=new TextEncoder(),td=new TextDecoder();
const derive=async(pw,salt,iter)=>{const km=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['encrypt','decrypt'])};
